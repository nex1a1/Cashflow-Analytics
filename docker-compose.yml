services:
  # 1. [PROD] ใช้งานจริง: API + หน้าเว็บที่ build แล้วใน container เดียว เปิดที่ http://localhost:5173
  #    เริ่ม/อัปเดตหลังแก้โค้ด: docker compose up -d --build prod
  prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: expense_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:3000" # เครื่องนี้เท่านั้น: API ไม่มีระบบล็อกอิน
    volumes:
      - ./backend/data:/app/data       # ฐานข้อมูลเดียวกับ dev
      - ./backend/backups:/app/backups

  # 2. [DEV] Backend (tsx watch, :3000) + Frontend (Vite HMR, :5172) ใน container เดียว ฐานข้อมูลเดียวกับ prod
  #    เริ่ม: docker compose up -d dev  ·  หยุด: docker compose stop dev  ·  ดู log: docker logs -f expense_dev (แยกด้วย [api] / [web])
  dev:
    profiles: ["dev"]
    image: node:24.22.1-alpine
    container_name: expense_dev
    working_dir: /workspace
    volumes:
      - ./backend:/workspace/backend
      - ./frontend:/workspace/frontend
      - backend_node_modules:/workspace/backend/node_modules   # แคชแพ็กเกจ
      - frontend_node_modules:/workspace/frontend/node_modules
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:5172:5172"
    environment:
      - PORT=3000
      - DB_PATH=/workspace/backend/data/cashflow.db
      - PUBLIC_DIR=/nonexistent # :3000 เป็น API อย่างเดียว ไม่เสิร์ฟ frontend/dist ที่อาจเป็น build เก่า
      - TZ=Asia/Bangkok
      - CHOKIDAR_USEPOLLING=true
      # - VITE_DEMO_MODE=true
    # ติดตั้งใหม่เมื่อ package-lock.json ต่างจากสำเนาที่เก็บไว้ตอนติดตั้งครั้งก่อน (volume แคชแพ็กเกจเก่าไว้ ไม่งั้นอัปเกรดแล้วไม่ถึง dev)
    # better-sqlite3 ไม่มี prebuild สำหรับ alpine จึงต้อง compile
    # ฝั่งใดฝั่งหนึ่งจบ หรือสั่ง docker stop: หยุดทั้งคู่แล้วปิด container จะได้เห็นใน docker ps ว่าไม่ได้รันอยู่
    # ห้ามใช้ wait -n: sh เป็น PID 1 ต้องรับ process กำพร้าตอน tsx restart ทำให้ wait -n คืนค่าทั้งที่ทั้งสองฝั่งยังรันอยู่
    command:
      - sh
      - -c
      - |
        (cd backend && { cmp -s package-lock.json node_modules/.installed-lock.json || { apk add --no-cache python3 make g++ && npm ci --no-audit --no-fund && cp package-lock.json node_modules/.installed-lock.json; }; }) || exit 1
        (cd frontend && { cmp -s package-lock.json node_modules/.installed-lock.json || { npm ci --no-audit --no-fund && cp package-lock.json node_modules/.installed-lock.json; }; }) || exit 1
        trap : TERM INT
        (cd backend && npm run dev 2>&1 | awk '{ print "[api] " $$0; fflush() }'; kill $$$$) &
        (cd frontend && npm run dev -- --host --port 5172 --strictPort 2>&1 | awk '{ print "[web] " $$0; fflush() }'; kill $$$$) &
        wait
        trap '' TERM INT
        kill 0
        wait

volumes:
  backend_node_modules:
  frontend_node_modules:
