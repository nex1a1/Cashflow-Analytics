services:
  # 1. [PROD] ใช้งานจริง: API + หน้าเว็บที่ build แล้วใน container เดียว เปิดที่ http://localhost:5173
  #    เริ่ม/อัปเดตหลังแก้โค้ด: docker compose up -d --build prod
  prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: expense_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:3000" # เครื่องนี้เท่านั้น: API ไม่มีระบบล็อกอิน
    volumes:
      - ./backend/data:/app/data       # ฐานข้อมูลเดียวกับ dev
      - ./backend/backups:/app/backups

  # 2. [DEV] Backend (tsx watch, :3000) เปิดพร้อม frontend-dev: docker compose --profile dev up -d
  backend-dev:
    profiles: ["dev"]
    image: node:24.22.1-alpine
    container_name: expense_dev_api
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules   # แคชแพ็กเกจ
      - ./backend/data:/app/data                 # Bind mount ไปยังโฟลเดอร์ในโปรเจกต์
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - DB_PATH=/app/data/cashflow.db
      - TZ=Asia/Bangkok
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "[ -f node_modules/.package-lock.json ] || { apk add --no-cache python3 make g++ && npm install --no-audit --no-fund; }; npm run dev" # better-sqlite3 ไม่มี prebuild สำหรับ alpine จึงต้อง compile

  # 3. [DEV] Frontend dev server (HMR, :5172) ส่ง /api ต่อไปที่ backend-dev
  frontend-dev:
    profiles: ["dev"]
    image: node:24.22.1-alpine
    container_name: expense_dev_web
    working_dir: /app
    depends_on:
      - backend-dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5172:5172"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - TZ=Asia/Bangkok
      - VITE_BACKEND_TARGET=http://backend-dev:3000
      # - VITE_DEMO_MODE=true
    command: sh -c "[ -f node_modules/.package-lock.json ] || npm install --no-audit --no-fund; npm run dev -- --host --port 5172 --strictPort"

volumes:
  backend_node_modules:
  frontend_node_modules:
