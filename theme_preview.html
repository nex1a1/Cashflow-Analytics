<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashflow Shark - Legendary 4-Color Palettes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .dark-theme { background-color: #020617 !important; color: #f8fafc !important; }
        .palette-card { cursor: pointer; transition: all 0.2s; border-width: 2px; }
        .palette-card:hover { transform: translateY(-4px); border-color: #3b82f6; }
    </style>
</head>
<body class="p-8 bg-slate-100 text-slate-900 transition-colors duration-300" id="body">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-10 border-b border-slate-300 pb-6 dark:border-slate-800">
            <div>
                <h1 class="text-4xl font-black tracking-tighter italic">LEGENDARY PALETTES</h1>
                <p class="text-slate-500 font-bold uppercase tracking-widest text-xs mt-1 dark:text-slate-400">4-Color Systems Inspired by the Greats</p>
            </div>
            <button onclick="toggleDarkMode()" class="px-6 py-3 bg-slate-950 text-white dark:bg-white dark:text-slate-900 font-black rounded-sm shadow-xl hover:scale-105 transition-transform active:scale-95">
                TOGGLE LIGHT/DARK
            </button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4" id="palette-grid">
            <!-- Legendary Palettes injected here -->
        </div>

        <div class="mt-12 p-8 border rounded-xl shadow-2xl transition-all duration-500 bg-slate-50 dark:bg-slate-900/50 dark:border-slate-800" id="preview-section">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-2xl font-black uppercase tracking-tight" id="preview-title">Preview: RX-78-2 Gundam</h2>
                <div class="flex gap-2" id="preview-swatches">
                    <!-- Current Palette Swatches -->
                </div>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- App Interface Mockup -->
                <div class="lg:col-span-2 bg-white dark:bg-slate-800 rounded-sm border border-slate-200 dark:border-slate-700 overflow-hidden shadow-sm">
                    <!-- Fake Header -->
                    <div id="mock-header" class="px-4 py-3 flex justify-between items-center border-b">
                        <div class="flex items-center gap-2">
                            <div id="mock-logo" class="w-6 h-6 rounded-sm"></div>
                            <span class="font-black text-sm uppercase tracking-widest">Cashflow Shark</span>
                        </div>
                        <div class="flex gap-2">
                            <div id="mock-tab-1" class="px-3 py-1 text-[10px] font-bold rounded-sm border">Dashboard</div>
                            <div id="mock-tab-2" class="px-3 py-1 text-[10px] font-bold rounded-sm border opacity-50">Ledger</div>
                        </div>
                    </div>
                    <!-- Fake Content -->
                    <div class="p-6">
                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <div class="p-4 border border-slate-100 dark:border-slate-700 rounded-sm">
                                <div id="mock-stat-label" class="text-[9px] font-black uppercase tracking-widest mb-1">Total Balance</div>
                                <div id="mock-stat-value" class="text-2xl font-black">฿450,000</div>
                            </div>
                            <div class="p-4 border border-slate-100 dark:border-slate-700 rounded-sm">
                                <div id="mock-stat-label-2" class="text-[9px] font-black uppercase tracking-widest mb-1">Daily Spend</div>
                                <div id="mock-stat-value-2" class="text-2xl font-black">฿1,200</div>
                            </div>
                        </div>
                        <button id="mock-main-btn" class="w-full py-3 font-black text-xs uppercase tracking-widest text-white rounded-sm shadow-md">
                            Execute Transaction
                        </button>
                    </div>
                </div>

                <!-- Color Logic Description -->
                <div class="space-y-4">
                    <div class="p-4 bg-white dark:bg-slate-800 rounded-sm border dark:border-slate-700">
                        <h3 class="text-xs font-black uppercase tracking-widest mb-3 text-slate-400">Color System Logic</h3>
                        <ul class="text-[11px] space-y-2 font-bold uppercase tracking-wide">
                            <li class="flex items-center gap-2"><div id="dot-1" class="w-2 h-2 rounded-full"></div> Primary: Base Branding</li>
                            <li class="flex items-center gap-2"><div id="dot-2" class="w-2 h-2 rounded-full"></div> Secondary: UI Accents</li>
                            <li class="flex items-center gap-2"><div id="dot-3" class="w-2 h-2 rounded-full"></div> Contrast: Highlights</li>
                            <li class="flex items-center gap-2"><div id="dot-4" class="w-2 h-2 rounded-full"></div> Support: Sub-data</li>
                        </ul>
                    </div>
                    <div id="mock-chart-card" class="p-6 bg-white dark:bg-slate-800 rounded-sm border dark:border-slate-700 h-[180px] flex flex-col">
                        <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-4">Flow Analysis</span>
                        <div class="flex-1 flex items-end gap-2">
                            <div id="bar-1" class="w-full rounded-t-sm" style="height: 80%"></div>
                            <div id="bar-2" class="w-full rounded-t-sm" style="height: 60%"></div>
                            <div id="bar-3" class="w-full rounded-t-sm" style="height: 40%"></div>
                            <div id="bar-4" class="w-full rounded-t-sm" style="height: 90%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const palettes = [
            { id: 1, name: "RX-78-2 Gundam", colors: ["#00509E", "#EF4444", "#F59E0B", "#F8FAF0"] },
            { id: 2, name: "Mega Man (Capcom)", colors: ["#0EA5E9", "#1E40AF", "#FBBF24", "#FFFFFF"] },
            { id: 3, name: "Devil May Cry (Dante)", colors: ["#991B1B", "#111827", "#94A3B8", "#F3F4F6"] },
            { id: 4, name: "Umbrella (Biohazard)", colors: ["#DC2626", "#F9FAFB", "#1F2937", "#94A3B8"] },
            { id: 5, name: "Unit-01 (Evangelion)", colors: ["#7C3AED", "#10B981", "#F97316", "#020617"] },
            { id: 6, name: "Phantom Thief (P5)", colors: ["#D32F2F", "#121212", "#757575", "#FFFFFF"] },
            { id: 7, name: "Cloud (FFVII)", colors: ["#0D9488", "#64748B", "#EAB308", "#0F172A"] },
            { id: 8, name: "Monster Hunter", colors: ["#B91C1C", "#1C1917", "#D97706", "#F5F5F4"] },
            { id: 9, name: "Night City (2077)", colors: ["#FDE047", "#F472B6", "#22D3EE", "#1E293B"] },
            { id: 10, name: "Street Fighter (Ryu)", colors: ["#F9FAFB", "#B91C1C", "#111827", "#EAB308"] }
        ];

        let isDark = false;
        let activePalette = palettes[0];

        function toggleDarkMode() {
            isDark = !isDark;
            const body = document.getElementById('body');
            const previewSection = document.getElementById('preview-section');
            
            if (isDark) {
                body.classList.add('dark-theme');
                body.classList.remove('bg-slate-100', 'text-slate-900');
                previewSection.classList.add('dark');
            } else {
                body.classList.remove('dark-theme');
                body.classList.add('bg-slate-100', 'text-slate-900');
                previewSection.classList.remove('dark');
            }
            updatePreview();
        }

        function renderPalettes() {
            const grid = document.getElementById('palette-grid');
            grid.innerHTML = palettes.map(p => `
                <div onclick="selectPalette(${p.id})" class="palette-card bg-white dark:bg-slate-800 p-3 rounded-sm shadow-lg border-2 ${activePalette.id === p.id ? 'border-blue-500 scale-105 z-10' : 'border-transparent'}">
                    <div class="flex h-10 rounded-sm overflow-hidden mb-2">
                        <div style="background-color: ${p.colors[0]}" class="flex-1"></div>
                        <div style="background-color: ${p.colors[1]}" class="flex-1"></div>
                        <div style="background-color: ${p.colors[2]}" class="flex-1"></div>
                        <div style="background-color: ${p.colors[3]}" class="flex-1"></div>
                    </div>
                    <div class="text-[9px] font-black uppercase tracking-widest text-center dark:text-slate-200">${p.name}</div>
                </div>
            `).join('');
        }

        function selectPalette(id) {
            activePalette = palettes.find(p => p.id === id);
            renderPalettes();
            updatePreview();
        }

        function updatePreview() {
            const c = activePalette.colors;
            
            document.getElementById('preview-title').innerText = `Preview: ${activePalette.name}`;
            
            // Swatches
            document.getElementById('preview-swatches').innerHTML = c.map(color => `
                <div class="w-8 h-8 rounded-full border border-white/20 shadow-sm" style="background-color: ${color}"></div>
            `).join('');

            // UI Mockup
            document.getElementById('mock-logo').style.backgroundColor = c[0];
            
            const header = document.getElementById('mock-header');
            header.style.backgroundColor = isDark ? '#1e293b' : c[3];
            header.style.borderColor = isDark ? '#334155' : '#e2e8f0';
            header.style.color = isDark ? '#f8fafc' : c[0];

            const tab1 = document.getElementById('mock-tab-1');
            tab1.style.borderColor = c[0];
            tab1.style.color = c[0];
            tab1.style.backgroundColor = c[0] + '10';

            document.getElementById('mock-stat-value').style.color = c[0];
            document.getElementById('mock-stat-label').style.color = c[1];
            document.getElementById('mock-stat-label-2').style.color = c[2];

            document.getElementById('mock-main-btn').style.backgroundColor = c[0];
            
            // Dots
            document.getElementById('dot-1').style.backgroundColor = c[0];
            document.getElementById('dot-2').style.backgroundColor = c[1];
            document.getElementById('dot-3').style.backgroundColor = c[2];
            document.getElementById('dot-4').style.backgroundColor = c[3];

            // Bars
            document.getElementById('bar-1').style.backgroundColor = c[0];
            document.getElementById('bar-2').style.backgroundColor = c[1];
            document.getElementById('bar-3').style.backgroundColor = c[2];
            document.getElementById('bar-4').style.backgroundColor = c[3];
        }

        renderPalettes();
        updatePreview();
    </script>
</body>
</html>
